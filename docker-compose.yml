services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["rag-data:/app/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s

  ui:
    build: .
    env_file: .env
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports: ["8501:8501"]
    volumes: ["rag-data:/app/data"]

volumes:
  rag-data:
